name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  agent:
    name: bundle and bytecode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: install
        run: npm ci --no-fund --no-audit

      - name: typecheck
        run: npm run typecheck

      - name: bundle source
        run: npx frida-compile src/Index.ts -B iife -o build/agent.js

      - name: bundle minified
        run: npx frida-compile src/Index.ts -B iife -c -o build/agent.min.js

      - name: bytecode
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          node --input-type=commonjs -e "const fs=require('fs'),frida=require('frida');(async()=>{const session=await frida.attach(0);const source=fs.readFileSync('build/agent.js','utf8');const bytecode=await session.compileScript(source);fs.writeFileSync('build/script_69_252.js',bytecode);console.log('bytecode:',bytecode.length,'bytes');})().catch(e=>{console.error(e);process.exit(1)})"

      - name: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-${{ github.sha }}
          path: build
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: summary
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### build"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| node | \`$(node --version)\` |"
            echo "| agent.js | $(wc -c < build/agent.js) bytes |"
            echo "| agent.min.js | $(wc -c < build/agent.min.js) bytes |"
            echo "| script_69_252.js | $(wc -c < build/script_69_252.js) bytes |"
          } >> "$summary"