name: prepare

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  heal:
    name: format, lint, push
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(prepare)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: install
        run: npm ci --no-fund --no-audit

      - name: format
        run: npx prettier --write src eslint.config.mjs package.json tsconfig.json

      - name: lint fix
        run: npm run lint:fix || true

      - name: format after fixes
        run: npx prettier --write src eslint.config.mjs package.json tsconfig.json

      - name: typecheck
        run: npm run typecheck

      - name: commit and push
        run: |
          git config user.name "prepare"
          git config user.email "prepare@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to heal"
            exit 0
          fi
          git commit -m "chore(prepare): format and lint"
          git pull --rebase --autostash origin main
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "healed in $(git rev-parse --short HEAD)"

      - name: gates
        run: |
          npm run lint
          npm run format:check