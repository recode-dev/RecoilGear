name: prepare

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PRETTIER_VERSION: "3.9.10"
  ESLINT_VERSION: "10.14.0"

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  heal:
    name: heal
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(prepare)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: tools
        run: |
          mkdir -p "${RUNNER_TEMP}/tools"
          cd "${RUNNER_TEMP}/tools"
          npm init -y > /dev/null
          npm install --no-fund --no-audit --legacy-peer-deps \
            "prettier@${PRETTIER_VERSION}" \
            "eslint@${ESLINT_VERSION}" \
            "eslint-plugin-unicorn@^60" \
            "eslint-plugin-sonarjs@^3" \
            "eslint-plugin-import-x@^4" \
            "eslint-plugin-unused-imports@^4"

      - name: config
        run: |
          cat > "${RUNNER_TEMP}/tools/prettier.json" <<'PRETTIER'
          {
              "printWidth": 100,
              "tabWidth": 4,
              "useTabs": false,
              "semi": true,
              "singleQuote": false,
              "trailingComma": "none",
              "arrowParens": "always",
              "bracketSpacing": true,
              "endOfLine": "lf"
          }
          PRETTIER
          cat > "${RUNNER_TEMP}/tools/eslint.config.mjs" <<'ESLINT'
          import unicorn from "eslint-plugin-unicorn";
          import sonarjs from "eslint-plugin-sonarjs";
          import importX from "eslint-plugin-import-x";
          import unusedImports from "eslint-plugin-unused-imports";

          const globals = {
              ptr: "readonly",
              NULL: "readonly",
              Memory: "readonly",
              NativeFunction: "readonly",
              NativeCallback: "readonly",
              NativePointer: "readonly",
              Module: "readonly",
              Process: "readonly",
              Interceptor: "readonly",
              File: "readonly",
              Script: "readonly",
              Thread: "readonly",
              send: "readonly",
              recv: "readonly",
              rpc: "readonly",
              setTimeout: "readonly",
              clearTimeout: "readonly",
              setInterval: "readonly",
              clearInterval: "readonly"
          };

          export default [
              {
                  files: ["**/*.js"],
                  languageOptions: {
                      ecmaVersion: 2022,
                      sourceType: "module",
                      globals
                  },
                  linterOptions: { reportUnusedDisableDirectives: "error" },
                  plugins: {
                      unicorn,
                      sonarjs,
                      "import-x": importX,
                      "unused-imports": unusedImports
                  },
                  rules: {
                      ...unicorn.configs.recommended.rules,

                      "no-unused-vars": ["error", { args: "none", caughtErrors: "none", varsIgnorePattern: "^_" }],
                      "no-undef": "error",
                      "no-redeclare": "error",
                      "no-dupe-keys": "error",
                      "no-dupe-args": "error",
                      "no-duplicate-case": "error",
                      "no-unreachable": "error",
                      "no-unreachable-loop": "error",
                      "no-constant-condition": ["error", { checkLoops: false }],
                      "no-empty": ["error", { allowEmptyCatch: true }],
                      "no-fallthrough": "error",
                      "no-self-assign": "error",
                      "no-self-compare": "error",
                      "no-unmodified-loop-condition": "error",
                      "no-use-before-define": ["error", { functions: false, classes: false }],
                      "eqeqeq": ["error", "smart"],
                      "no-eval": "error",
                      "no-implied-eval": "error",
                      "no-new-func": "error",
                      "no-debugger": "error",
                      "prefer-const": "error",

                      "complexity": ["error", 15],
                      "max-depth": ["error", 4],
                      "max-params": ["error", 5],
                      "max-nested-callbacks": ["error", 3],
                      "no-else-return": "error",
                      "no-lonely-if": "error",
                      "no-nested-ternary": "error",
                      "no-unneeded-ternary": "error",
                      "prefer-template": "error",
                      "no-useless-concat": "error",
                      "radix": "error",
                      "yoda": "error",
                      "no-undef-init": "error",

                      "import-x/order": ["error", {
                          "newlines-between": "always",
                          "alphabetize": { order: "asc", caseInsensitive: true }
                      }],
                      "import-x/no-duplicates": "error",

                      "unused-imports/no-unused-imports": "error",

                      "sonarjs/cognitive-complexity": ["error", 15],
                      "sonarjs/no-identical-expressions": "error",

                      "unicorn/prevent-abbreviations": "off",
                      "unicorn/no-null": "off",
                      "unicorn/prefer-module": "off",
                      "unicorn/no-array-callback-reference": "off",
                      "unicorn/filename-case": "off",
                      "unicorn/prefer-top-level-await": "off",
                      "unicorn/no-await-expression-member": "off",
                      "unicorn/prefer-ternary": "off",
                      "unicorn/numeric-separators-style": "off",
                      "unicorn/explicit-length-check": "off",
                      "unicorn/no-array-for-each": "off",
                      "unicorn/prefer-number-properties": "off",
                      "unicorn/no-useless-undefined": "off",
                      "unicorn/prefer-string-replace-all": "off"
                  }
              }
          ];
          ESLINT

      - name: strip debug
        run: |
          while IFS= read -r -d '' file; do
            sed -i -E \
              -e '/^[[:space:]]*console\.(log|debug|info|warn|error)\(.*\);[[:space:]]*$/d' \
              -e '/^[[:space:]]*debugger;[[:space:]]*$/d' \
              "$file"
          done < <(find agent -type f -name '*.js' -print0)

      - name: prettier
        run: |
          "${RUNNER_TEMP}/tools/node_modules/.bin/prettier" \
            --config "${RUNNER_TEMP}/tools/prettier.json" \
            --write "agent/**/*.js"

      - name: eslint fix
        run: |
          "${RUNNER_TEMP}/tools/node_modules/.bin/eslint" \
            --config "${RUNNER_TEMP}/tools/eslint.config.mjs" \
            --fix agent || true

      - name: commit and push
        run: |
          git config user.name "prepare"
          git config user.email "prepare@users.noreply.github.com"
          git add -A
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if git diff --cached --quiet; then
            echo "nothing to heal" >> "$summary"
            exit 0
          fi
          git commit -m "chore(prepare): format and lint"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            git pull --rebase --autostash
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "healed in $(git rev-parse --short HEAD)" >> "$summary"

  verify:
    name: verify
    needs: [heal]
    if: ${{ always() && needs.heal.result != 'failure' && needs.heal.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: tools
        run: |
          mkdir -p "${RUNNER_TEMP}/tools"
          cd "${RUNNER_TEMP}/tools"
          npm init -y > /dev/null
          npm install --no-fund --no-audit --legacy-peer-deps \
            "prettier@${PRETTIER_VERSION}" \
            "eslint@${ESLINT_VERSION}" \
            "eslint-plugin-unicorn@^60" \
            "eslint-plugin-sonarjs@^3" \
            "eslint-plugin-import-x@^4" \
            "eslint-plugin-unused-imports@^4"

      - name: config
        run: |
          cat > "${RUNNER_TEMP}/tools/prettier.json" <<'PRETTIER'
          {
              "printWidth": 100,
              "tabWidth": 4,
              "useTabs": false,
              "semi": true,
              "singleQuote": false,
              "trailingComma": "none",
              "arrowParens": "always",
              "bracketSpacing": true,
              "endOfLine": "lf"
          }
          PRETTIER
          cat > "${RUNNER_TEMP}/tools/eslint.config.mjs" <<'ESLINT'
          import unicorn from "eslint-plugin-unicorn";
          import sonarjs from "eslint-plugin-sonarjs";
          import importX from "eslint-plugin-import-x";
          import unusedImports from "eslint-plugin-unused-imports";

          const globals = {
              ptr: "readonly",
              NULL: "readonly",
              Memory: "readonly",
              NativeFunction: "readonly",
              NativeCallback: "readonly",
              NativePointer: "readonly",
              Module: "readonly",
              Process: "readonly",
              Interceptor: "readonly",
              File: "readonly",
              Script: "readonly",
              Thread: "readonly",
              send: "readonly",
              recv: "readonly",
              rpc: "readonly",
              setTimeout: "readonly",
              clearTimeout: "readonly",
              setInterval: "readonly",
              clearInterval: "readonly"
          };

          export default [
              {
                  files: ["**/*.js"],
                  languageOptions: {
                      ecmaVersion: 2022,
                      sourceType: "module",
                      globals
                  },
                  linterOptions: { reportUnusedDisableDirectives: "error" },
                  plugins: {
                      unicorn,
                      sonarjs,
                      "import-x": importX,
                      "unused-imports": unusedImports
                  },
                  rules: {
                      ...unicorn.configs.recommended.rules,

                      "no-unused-vars": ["error", { args: "none", caughtErrors: "none", varsIgnorePattern: "^_" }],
                      "no-undef": "error",
                      "no-redeclare": "error",
                      "no-dupe-keys": "error",
                      "no-dupe-args": "error",
                      "no-duplicate-case": "error",
                      "no-unreachable": "error",
                      "no-unreachable-loop": "error",
                      "no-constant-condition": ["error", { checkLoops: false }],
                      "no-empty": ["error", { allowEmptyCatch: true }],
                      "no-fallthrough": "error",
                      "no-self-assign": "error",
                      "no-self-compare": "error",
                      "no-unmodified-loop-condition": "error",
                      "no-use-before-define": ["error", { functions: false, classes: false }],
                      "eqeqeq": ["error", "smart"],
                      "no-eval": "error",
                      "no-implied-eval": "error",
                      "no-new-func": "error",
                      "no-debugger": "error",
                      "prefer-const": "error",

                      "complexity": ["error", 15],
                      "max-depth": ["error", 4],
                      "max-params": ["error", 5],
                      "max-nested-callbacks": ["error", 3],
                      "no-else-return": "error",
                      "no-lonely-if": "error",
                      "no-nested-ternary": "error",
                      "no-unneeded-ternary": "error",
                      "prefer-template": "error",
                      "no-useless-concat": "error",
                      "radix": "error",
                      "yoda": "error",
                      "no-undef-init": "error",

                      "import-x/order": ["error", {
                          "newlines-between": "always",
                          "alphabetize": { order: "asc", caseInsensitive: true }
                      }],
                      "import-x/no-duplicates": "error",

                      "unused-imports/no-unused-imports": "error",

                      "sonarjs/cognitive-complexity": ["error", 15],
                      "sonarjs/no-identical-expressions": "error",

                      "unicorn/prevent-abbreviations": "off",
                      "unicorn/no-null": "off",
                      "unicorn/prefer-module": "off",
                      "unicorn/no-array-callback-reference": "off",
                      "unicorn/filename-case": "off",
                      "unicorn/prefer-top-level-await": "off",
                      "unicorn/no-await-expression-member": "off",
                      "unicorn/prefer-ternary": "off",
                      "unicorn/numeric-separators-style": "off",
                      "unicorn/explicit-length-check": "off",
                      "unicorn/no-array-for-each": "off",
                      "unicorn/prefer-number-properties": "off",
                      "unicorn/no-useless-undefined": "off",
                      "unicorn/prefer-string-replace-all": "off"
                  }
              }
          ];
          ESLINT

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          fail-on-error: true

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd
        with:
          advanced-security: false
          min-severity: high
          annotations: true

      - name: syntax
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            node --check "$file" || failed=1
          done < <(find agent -type f -name '*.js' -print0)
          exit "$failed"

      - name: lint
        run: |
          "${RUNNER_TEMP}/tools/node_modules/.bin/eslint" \
            --config "${RUNNER_TEMP}/tools/eslint.config.mjs" \
            --max-warnings 0 agent

      - name: format
        run: |
          "${RUNNER_TEMP}/tools/node_modules/.bin/prettier" \
            --config "${RUNNER_TEMP}/tools/prettier.json" \
            --check "agent/**/*.js"

      - name: manifest
        run: |
          : > "${RUNNER_TEMP}/agent-manifest.txt"
          while IFS= read -r -d '' file; do
            sha256sum "$file" >> "${RUNNER_TEMP}/agent-manifest.txt"
          done < <(find agent -type f -name '*.js' -print0 | sort -z)

      - name: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-${{ github.sha }}
          path: |
            agent
            ${{ runner.temp }}/agent-manifest.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: summary
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### prepare"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| node | \`$(node --version)\` |"
            echo "| prettier | \`$("${RUNNER_TEMP}/tools/node_modules/.bin/prettier" --version)\` |"
            echo "| eslint | \`$("${RUNNER_TEMP}/tools/node_modules/.bin/eslint" --version)\` |"
            echo "| files | $(find agent -type f -name '*.js' | wc -l) |"
          } >> "$summary"